<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEO Satellite Simulation</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@6.0.2/dist/satellite.min.js"></script>
</head>
<body>
<div id="scene"></div>
<div id="notice" role="status"></div>
<div id="loading">Loading satellites…</div>

<div id="panel" class="card">
  <h1>LEO Satellite Simulation</h1>
  <div class="muted small" id="subtitle"></div>
  <div class="row">
    <select id="datasetSel" aria-label="Data source" style="width:100%"></select>
  </div>
  <div id="eventBanner"></div>
  <div id="clock">—</div>
  <div class="row" id="speeds"></div>
  <div class="row">
    <button id="now">Jump to now</button>
    <button id="plusHour">+1 h</button>
    <button id="plusDay">+1 day</button>
    <button id="plusWeek">+1 week</button>
  </div>
  <div class="row">
    <input id="goDate" type="datetime-local" step="60" aria-label="Date and time (UTC)">
    <button id="goDateBtn">Go (UTC)</button>
  </div>
  <div class="row">
    <select id="colorMode" aria-label="Colour satellites by">
      <option value="group">Colour: constellation</option>
      <option value="altitude">Colour: altitude</option>
    </select>
  </div>
  <label class="legend-item"><input type="checkbox" id="leoToggle" checked>
    <span class="swatch" style="background:transparent;border:1.5px solid #6fb8ff"></span>
    <span>LEO boundary (2,000 km altitude)</span></label>

  <div class="section">
    <div class="section-title">Find a satellite</div>
    <input id="search" type="search" placeholder="Name or NORAD ID, e.g. ISS or 25544" autocomplete="off">
    <div id="suggestions"></div>
  </div>

  <div class="section">
    <div class="section-title">Groups</div>
    <div id="gradient"></div>
    <div id="gradient-labels" class="small muted"><span>200</span><span>400</span><span>600</span><span>1000</span><span>2000 km</span></div>
    <div id="legend"></div>
  </div>

  <div class="section small">
    <div class="section-title">Visible now</div>
    <dl id="stats"></dl>
  </div>
  <div class="small muted" style="margin-top:10px">Drag to rotate, scroll to zoom, click a satellite for details.</div>
</div>

<div id="info" class="card">
  <button id="close" aria-label="Close">×</button>
  <h2 id="infoName"></h2>
  <div class="muted small" id="infoSub"></div>
  <div id="infoConj"></div>
  <div id="infoZone"></div>
  <dl id="infoBody"></dl>
</div>

<div id="conj" class="card">
  <div class="conj-head">
    <h1>Conjunction screening</h1>
    <span class="muted small" id="conjCount"></span>
  </div>
  <div class="muted small" id="conjSummary"></div>
  <div id="conjStatus"></div>
  <div class="row">
    <button id="conjScreenHere">Screen from current time</button>
    <select id="conjSpan" aria-label="Length of on-demand screening">
      <option value="24" selected>24 h</option>
      <option value="72">3 days</option>
      <option value="168">7 days</option>
    </select>
  </div>
  <div class="conj-next" id="conjNext"></div>

  <div class="row">
    <select id="conjFilter" aria-label="Which events">
      <option value="red">Critical only</option>
      <option value="all">Critical + watch</option>
      <option value="debris">Satellite vs debris (all &lt; 5 km)</option>
      <option value="zones">Debris vs debris red zones</option>
    </select>
    <select id="conjSort" aria-label="Sort events">
      <option value="tca">Soonest TCA</option>
      <option value="pc">Highest Pc</option>
      <option value="miss">Smallest miss</option>
    </select>
    <select id="conjRange" aria-label="Look-ahead window">
      <option value="1">Next 1 h</option>
      <option value="6">Next 6 h</option>
      <option value="24" selected>Next 24 h</option>
      <option value="72">Next 3 days</option>
      <option value="all">Whole window</option>
    </select>
  </div>
  <div class="section-title" style="margin-top:8px">Events per day · click to jump</div>
  <div id="conjDays"></div>
  <label class="small"><input type="checkbox" id="conjHideSame"> Hide same-constellation pairs</label>
  <div id="conjFocus"></div>
  <div id="conjList"></div>
  <div class="muted small" id="conjNote"></div>
</div>

<div id="conjDetail" class="card">
  <div class="conj-head">
    <h1>Analysing conjunction</h1>
    <button id="conjClose" aria-label="Close analysis">×</button>
  </div>
  <div id="conjPair"></div>
  <dl id="conjDetailBody"></dl>
  <div id="conjZone"></div>
  <div class="row">
    <button id="conjLead">TCA − 10 min</button>
    <button id="conjTca">Jump to TCA</button>
    <label class="small"><input type="checkbox" id="conjAutoPause" checked> Pause at TCA</label>
  </div>
  <div class="row"><button id="conjManeuver" class="primary">Plan / replay avoidance manoeuvre</button></div>
  <div id="conjPlan"></div>
</div>

<div id="zoneAlert" class="card" role="alert"></div>
<div id="planHud" class="card" role="status"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
